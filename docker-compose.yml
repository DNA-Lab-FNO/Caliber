services:
  # ============================================================================
  # Database Service (PostgreSQL 16)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: caliber_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caliber_db}
      POSTGRES_USER: ${POSTGRES_USER:-caliber_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caliber_user} -d ${POSTGRES_DB:-caliber_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - caliber_network

  # ============================================================================
  # Application Service (Django + Svelte + Gunicorn)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caliber_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DATABASE_URL: postgres://${POSTGRES_USER:-caliber_user}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-caliber_db}
      USE_X_FORWARDED_PROTO: ${USE_X_FORWARDED_PROTO:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
    ports:
      # Expose port 8000 directly (accessible directly or via an external reverse proxy)
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent storage for uploaded media and reference dataset imports
      - caliber_data:/app/data
      - caliber_media:/app/media
    networks:
      - caliber_network

  # ============================================================================
  # Optional Reverse Proxy with Automatic HTTPS (Caddy)
  # Note: If you already have an existing reverse proxy (e.g. Nginx, Traefik,
  # or Cloudflare Tunnel) on the server, you can safely remove or comment out
  # this entire caddy block and point your reverse proxy to localhost:8000.
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caliber_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 support
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - caliber_network

networks:
  caliber_network:
    driver: bridge

volumes:
  postgres_data:
    name: caliber_postgres_data
  caliber_data:
    name: caliber_data
  caliber_media:
    name: caliber_media
  caddy_data:
    name: caliber_caddy_data
  caddy_config:
    name: caliber_caddy_config
